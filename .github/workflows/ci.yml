# CI — the same checks as `make lint`, `make test-config` and `make smoke`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit==4.6.0
      - run: pre-commit run --all-files --show-diff-on-failure

  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: make test-config

  smoke:
    runs-on: ubuntu-24.04
    needs: config
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      # No mkcert on the runner: generate-local-certs.sh falls back to openssl.
      - run: make init
      - run: make up
      - run: make smoke
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml logs --no-color
      - name: Stop stack
        if: always()
        run: make down

  # Build, push and cosign-sign the image on push to main, after every check passed.
  # The host executor verifies this workflow's exact identity from its Ansible allowlist.
  # Self-hosted runner (infra-runner): no Docker daemon, images are built with Buildah.
  publish:
    needs: [lint, config, smoke]
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (OIDC)
    env:
      IMAGE: ghcr.io/uye-ltd/infra-edge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildah storage
        run: |
          # containers/storage requires runRoot when graphRoot is set explicitly.
          printf '%s\n' \
            '[storage]' \
            '  driver = "overlay"' \
            '  graphRoot = "/kaniko"' \
            '  runRoot = "/tmp/buildah-run"' \
            '' \
            '[storage.options]' \
            '' \
            '  [storage.options.overlay]' \
            '    mount_program = "/usr/bin/fuse-overlayfs"' \
            > /etc/containers/storage.conf

      - name: Build and push
        id: build
        run: |
          buildah build \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --isolation=chroot \
            .
          buildah push --digestfile /tmp/digest.txt "${IMAGE}:${GITHUB_SHA}"
          echo "digest=$(cat /tmp/digest.txt)" >> "$GITHUB_OUTPUT"

      # Sign by digest: tags are mutable.
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The host verifier and promotion job read the legacy OCI signature tag.
          cosign sign --yes --new-bundle-format=false \
            "${IMAGE}@${DIGEST}"

  promote:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/uye-ltd/infra-edge
    steps:
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003  # v4.1.1
        with:
          cosign-release: 'v2.2.4'
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote signed digest
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          verified=$(cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}:${GITHUB_SHA}")
          digest=$(jq -er \
            '[.[].critical.image."docker-manifest-digest"] | unique | if length == 1 then .[0] else empty end' \
            <<< "$verified")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --prefer-index=false --metadata-file /tmp/promoted.json \
            --tag "${IMAGE}:latest" "${IMAGE}@${digest}"
          test "$(jq -r '."containerimage.descriptor".digest' /tmp/promoted.json)" = "$digest"
