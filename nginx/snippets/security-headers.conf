# ---- Security headers --------------------------------------------------------
# Include at server level. add_header is inherited by a location only if that
# location has no add_header of its own — if a site location adds a header,
# include this snippet inside that location as well.

# HSTS: tell browsers to always use HTTPS for the next 2 years
add_header  Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload"  always;
add_header  X-Frame-Options            "DENY"                               always;
add_header  X-Content-Type-Options     "nosniff"                            always;
add_header  X-XSS-Protection           "1; mode=block"                      always;
add_header  Referrer-Policy            "strict-origin-when-cross-origin"    always;
add_header  Permissions-Policy         "camera=(), microphone=(), geolocation=()"  always;
add_header  Content-Security-Policy    "default-src 'self'; frame-ancestors 'none'"  always;

# Propagate distributed trace ID to downstream services and expose to clients
add_header  X-Request-ID  $request_id  always;
