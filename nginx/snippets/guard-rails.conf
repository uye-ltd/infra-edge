# ---- Guard rails -------------------------------------------------------------
# Include at server level. Maps are defined in conf.d/security.conf.
if ($block_ua) {
    return 403;
}

if ($invalid_method) {
    return 405;
}

# Block access to sensitive paths: any path segment starting with one of these
# names (/.git, /.git/config, /.env, /.env.local, /x/.htpasswd, ...).
# Plain `return` — a `deny` here would be dead code (return runs first).
location ~* /\.(git|env|htaccess|htpasswd|DS_Store) {
    return 404;
}
