# ---- Guard rails -------------------------------------------------------------
# Include at server level. Maps are defined in conf.d/security.conf.
if ($block_ua) {
    return 403;
}

if ($invalid_method) {
    return 405;
}

# Block access to sensitive paths
location ~* \.(git|env|htaccess|htpasswd|DS_Store)$ {
    deny all;
    return 404;
}
