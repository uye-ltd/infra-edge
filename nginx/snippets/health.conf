# ---- Health & observability endpoints ----------------------------------------
# Include at server level.

# Public health probe (used by orchestrators, uptime monitors)
location = /healthz {
    access_log    off;
    # default_type, not add_header: add_header would emit a second Content-Type
    # (next to the default one) and drop the inherited security headers.
    default_type  application/json;
    return 200  '{"status":"ok","service":"uye-edge"}';
}

# Nginx stub_status — restricted to internal networks for Prometheus scraping
location = /nginx-status {
    stub_status  on;
    access_log   off;
    allow   127.0.0.1;
    allow   10.0.0.0/8;
    allow   172.16.0.0/12;
    allow   192.168.0.0/16;
    deny    all;
}
