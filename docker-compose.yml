# Fixed project name: the infra-runner deployer, scripts/certbot-renew.sh and manual
# commands must all address the same project, whatever the checkout directory is called.
name: infra-edge

services:

  # ---------------------------------------------------------------------------
  # NGINX Edge Gateway
  # ---------------------------------------------------------------------------
  nginx:
    # Built and cosign-signed by CI (.github/workflows/ci.yml, job publish); the
    # infra-runner deployer pulls new digests and recreates this service
    # (.infra-runner.plugin). Local builds: docker-compose.local.yml.
    image: ghcr.io/uye-ltd/infra-edge:latest
    container_name: uye-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS certificates provisioned by Certbot (read-only inside nginx)
      - certbot_certs:/etc/nginx/ssl:ro
      # Certbot webroot for ACME challenge files
      - certbot_webroot:/var/www/certbot:ro
    # Logs: no volume. The base image symlinks /var/log/nginx/{access,error}.log
    # to stdout/stderr, so logs go to the Docker logging driver
    # (`docker logs uye-edge`); ship them from there (Loki, ELK, ...).
    env_file: .env
    networks:
      - edge
    # required: false — go-gateway exists only under the 'stub' profile; without
    # it nginx must still start (production upstream joins the edge network).
    depends_on:
      go-gateway:
        condition: service_started
        required: false
    # Drop all Linux capabilities; add back only what nginx actually needs:
    #   NET_BIND_SERVICE — bind to privileged ports 80 and 443
    #   CHOWN           — chown log files to the nginx user at startup
    #   SETUID / SETGID — master process drops worker privileges to nginx:nginx
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    # Prevent any process inside the container from gaining new privileges
    # via setuid binaries or file capabilities after startup.
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem; nginx still needs a handful of writable paths.
    read_only: true
    tmpfs:
      # Root-owned on purpose: the master runs as root WITHOUT CAP_DAC_OVERRIDE,
      # so it can only write to dirs it owns. It creates the *_temp subdirs
      # itself and chowns them to the nginx worker user (CAP_CHOWN).
      - /var/cache/nginx                   # proxy/client-body temp files
      - /var/run                           # nginx.pid
      - /tmp:uid=101,gid=101              # general scratch space
      - /etc/nginx/generated              # envsubst output (root-owned: entrypoint runs as root without DAC_OVERRIDE)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Certbot — certificate issuance and renewal
  # Run once manually: docker compose run --rm certbot
  # Renewal is handled by the certbot-renew.sh cron/script on the host.
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: uye-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos
      --no-eff-email
      --keep-until-expiring
      -d ${NGINX_DOMAIN}
      -d www.${NGINX_DOMAIN}
    profiles:
      - certbot

  # ---------------------------------------------------------------------------
  # Prometheus metrics exporter for NGINX stub_status
  # Scrapes /nginx-status and exposes Prometheus metrics on :9113/metrics
  # ---------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    container_name: uye-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx/nginx-status
    ports:
      - "9113:9113"
    networks:
      - edge
    depends_on:
      - nginx
    profiles:
      - observability

  # ---------------------------------------------------------------------------
  # Go Gateway (upstream) — reference entry; replace with your actual service
  # or define it in a separate compose file for that repository.
  # ---------------------------------------------------------------------------
  go-gateway:
    image: "${GO_GATEWAY_IMAGE:-nginx:alpine}"
    container_name: uye-go-gateway
    restart: unless-stopped
    networks:
      - edge
    profiles:
      - stub

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  certbot_certs:
  certbot_webroot:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  edge:
    # Fixed name (not <project>_edge): the Go Gateway stack joins it as
    # `external: true` under this name.
    name: uye-edge
    driver: bridge
