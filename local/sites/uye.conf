# Local-only gateway site. Production waits for the real go-gateway service.
server {
    include /etc/nginx/snippets/tls.conf;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_trusted_certificate /etc/nginx/ssl/ca.pem;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/guard-rails.conf;
    include /etc/nginx/snippets/health.conf;

    location ^~ /api/auth/ {
        limit_req zone=auth burst=50 nodelay;
        limit_conn conn_per_ip 100;
        proxy_pass http://go_gateway;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=200 nodelay;
        limit_conn conn_per_ip 100;
        proxy_pass http://go_gateway;
    }

    location / {
        limit_req zone=general burst=500 nodelay;
        limit_conn conn_per_ip 100;
        proxy_pass http://go_gateway;
    }

    include /etc/nginx/snippets/error-pages.conf;
}
