# ---- Site: demo (local only) -------------------------------------------------
# Second site on https://demo.localhost, used to exercise the multi-site setup
# locally: per-site upstream, shared snippets, Host/SNI isolation.
#
# Static (no envsubst) and mounted only by docker-compose.local.yml into
# /etc/nginx/local-sites/, which is empty in the production image.
# Follows the naming conventions of nginx/examples/app.conf.template.

upstream demo_backend {
    server demo-stub:80 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=demo_general:10m rate=2000r/m;

server {
    include /etc/nginx/snippets/tls.conf;
    server_name   demo.localhost;

    ssl_certificate         /etc/nginx/ssl/cert.pem;
    ssl_certificate_key     /etc/nginx/ssl/key.pem;
    ssl_trusted_certificate /etc/nginx/ssl/ca.pem;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/guard-rails.conf;
    include /etc/nginx/snippets/health.conf;

    location / {
        limit_req   zone=demo_general  burst=500  nodelay;
        limit_conn  conn_per_ip  100;

        proxy_pass  http://demo_backend;
    }

    include /etc/nginx/snippets/error-pages.conf;
}
