# Stub nginx config that simulates the Go Gateway for local development (docker-compose.local.yml).
# Returns a JSON response on all routes so you can verify the edge proxy works
# end-to-end without running the actual Go service.
server {
    listen 80;

    location / {
        default_type application/json;
        add_header X-Upstream-Stub "true";
        return 200 '{"service":"go-gateway-stub","host":"$host","path":"$uri","request_id":"$http_x_request_id","message":"This is a local stub. Replace with the real Go Gateway."}';
    }

    location = /health {
        access_log  off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
