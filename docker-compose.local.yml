# docker-compose.local.yml — local development overrides (developer machine)
#
# Usage (prefer the Makefile: `make init && make up`):
#   docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Differences from production:
#   - Local TLS certificate in ./certs/local (scripts/generate-local-certs.sh;
#     mkcert if installed, otherwise self-signed openssl)
#   - Stub Go Gateway using nginx:alpine echoing a JSON response
#   - Local-only demo site on https://demo.localhost (local/sites/) + demo-stub
#   - All profiles active by default (no certbot)
#   - nginx-exporter always enabled
#
# "local" is the developer machine; "dev" is reserved for a future shared dev server.
#
# Requires Docker Compose >= 2.24 for the !override / !reset merge tags:
# plain lists (env_file, profiles) are merged with the base file, not replaced.

services:

  nginx:
    volumes:
      # Mount locally generated certs instead of Let's Encrypt
      - ./certs/local:/etc/nginx/ssl:ro
      # Mount configs directly for hot-reload during local development
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      # Local-only static sites (demo.localhost)
      - ./local/sites:/etc/nginx/local-sites:ro
    env_file: !override
      - .env.local
    # nginx resolves upstream hosts at startup — demo-stub must exist first
    depends_on:
      demo-stub:
        condition: service_started

  go-gateway:
    image: nginx:alpine
    container_name: uye-go-gateway-local
    volumes:
      - ./local/go-gateway-stub.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    profiles: !reset []   # always active locally

  # Upstream of the local-only demo site (local/sites/demo.conf)
  demo-stub:
    image: nginx:alpine
    container_name: uye-demo-stub-local
    volumes:
      - ./local/demo-stub.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge

  nginx-exporter:
    profiles: !reset []   # always active locally
